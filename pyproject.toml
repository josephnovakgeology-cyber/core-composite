[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "core_composite"
version = "1.0.3"
description = "A python tool for stratigraphic correlation of scientific drilling materials."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Joseph B. Novak", email = "joseph_novak@brown.edu"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "pandas>=2.1.1",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "scipy>=1.11.3",
    "scikit-image>=0.22.0",
    "PyMuPDF>=1.23.5",
    "qtpy>=2.4.1",
    "colour-science>=0.4.4",
]

[project.optional-dependencies]
qt = [
    "PyQt5>=5.15.10",
]
dev = [
    "ipython",
    "spyder-kernels>=3.1.0"
]

[project.urls]
"Homepage" = "https://github.com/josephnovakgeology-cyber/core_composite"
"Bug Tracker" = "https://github.com/josephnovakgeology-cyber/core_composite/issues"